[project]
name = "hass-kiwee"
version = "0.1.0"
description = "Kiwee Broadband MoCA adapters for Home Assistant"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "rschoell" }]
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.9.0"]

[project.urls]
Homepage = "https://github.com/rschoell/hass-kiwee"
Issues = "https://github.com/rschoell/hass-kiwee/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "ruff>=0.5.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501"]
